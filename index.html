<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>For Aju</title>

  <!-- Google Fonts: Romantic Calligraphy, Editorial Serif & Clean UI Support -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Parisienne&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & CUSTOM PROPERTIES
       ========================================================================== */
    :root {
      /* Mandatory Palette */
      --burgundy: #70020F;
      --warm-ivory: #F8F5F0;
      --soft-blush: #FEDEE1;
      --muted-burgundy: rgba(112, 2, 15, 0.58);
      --cream-paper: #FBF9F5;
      --burgundy-shadow: #58010B;

      /* Subtle Supporting Stationery Tones */
      --ivory-shaded: #F1ECE3;
      --ivory-deep: #E8E1D5;
      --blush-deep: #F9C8CE;
      --burgundy-hairline: rgba(112, 2, 15, 0.24);
      --burgundy-faint: rgba(112, 2, 15, 0.11);
      --burgundy-glow: rgba(112, 2, 15, 0.07);

      /* Typography Stacks */
      --font-script: 'Allura', 'Great Vibes', 'Parisienne', cursive;
      --font-calligraphy: 'Great Vibes', 'Allura', 'Parisienne', cursive;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Responsive Envelope Dimensions */
      --env-width: clamp(276px, 76vw, 410px);
      --env-height: calc(var(--env-width) * 0.665);

      /* Custom Easing Curves */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out-sine: cubic-bezier(0.37, 0, 0.63, 1);
      --ease-flap: cubic-bezier(0.42, 0, 0.18, 1);
      --ease-wind-out: cubic-bezier(0.52, 0.04, 0.74, 0.2);
      --ease-letter-rise: cubic-bezier(0.25, 0.9, 0.32, 1);
    }

    /* ==========================================================================
       2. RESET & BASE AMBIENCE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--warm-ivory);
      color: var(--burgundy);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Ambient Warm Ivory Lighting & Subtle Editorial Vignette */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 44%, rgba(254, 222, 225, 0.42) 0%, rgba(251, 249, 245, 0.2) 42%, transparent 72%),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(112, 2, 15, 0.045) 100%),
        linear-gradient(165deg, #FAF8F4 0%, var(--warm-ivory) 52%, #F3EFE7 100%);
    }

    /* Tactile Paper Grain Overlay */
    .paper-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.36;
      mix-blend-mode: multiply;
    }

    /* Delicate Editorial Page Frame */
    .editorial-border {
      position: fixed;
      inset: clamp(12px, 2.6vmin, 26px);
      border: 1px solid rgba(112, 2, 15, 0.13);
      pointer-events: none;
      z-index: 35;
      transition: opacity 1s var(--ease-out-quart);
    }

    .editorial-border::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(112, 2, 15, 0.05);
    }

    /* Corner Botanical Hairline Accents on Frame */
    .corner-ornament {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(112, 2, 15, 0.32);
      border-style: solid;
      pointer-events: none;
    }
    .corner-ornament.tl { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; }
    .corner-ornament.tr { top: -1px; right: -1px; border-width: 1.5px 1.5px 0 0; }
    .corner-ornament.bl { bottom: -1px; left: -1px; border-width: 0 0 1.5px 1.5px; }
    .corner-ornament.br { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; }

    /* ==========================================================================
       3. MAIN VIEWPORT STAGE
       ========================================================================== */
    .stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      z-index: 10;
      perspective: 1400px;
    }

    /* ==========================================================================
       4. OPENING SCREEN — ENVELOPE ARCHITECTURE & LAYERED ANIMATIONS
       ========================================================================== */
    .envelope-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      transition: opacity 0.9s var(--ease-out-quart), visibility 0.9s;
    }

    .envelope-section.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Layer 1: Entrance & Recede Container */
    .envelope-entrance-wrap {
      opacity: 0;
      transform: translate3d(0, 38px, 0) scale(0.93) rotate(-2.2deg);
      transition:
        opacity 1.35s var(--ease-out-quart),
        transform 1.45s var(--ease-out-expo);
      will-change: transform, opacity;
    }

    .envelope-entrance-wrap.has-entered {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
    }

    /* Recede state when letter emerges and expands */
    .envelope-entrance-wrap.is-receding {
      opacity: 0;
      transform: translate3d(0, 68px, -140px) scale(0.86) rotate(0deg);
      transition:
        opacity 0.95s cubic-bezier(0.4, 0, 0.2, 1),
        transform 1.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Layer 2: Continuous Idle Floating & Subtle Oscillation */
    .envelope-float-wrap {
      position: relative;
      animation: idleEnvelopeFloat 6.2s var(--ease-in-out-sine) infinite;
      will-change: transform;
    }

    .envelope-float-wrap.float-paused {
      animation-play-state: paused;
      transform: translate3d(0, 0, 0) rotate(0deg) !important;
      transition: transform 0.55s var(--ease-out-quart);
    }

    @keyframes idleEnvelopeFloat {
      0%, 100% {
        transform: translate3d(0, 0px, 0) rotate(-0.45deg);
      }
      25% {
        transform: translate3d(2px, -5px, 0) rotate(0.25deg);
      }
      50% {
        transform: translate3d(0, -9px, 0) rotate(0.6deg);
      }
      75% {
        transform: translate3d(-2px, -4px, 0) rotate(-0.15deg);
      }
    }

    /* Layer 3: Interactive Button / Hover / Touch Wrapper */
    .envelope-button {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: none;
      display: block;
      transform-style: preserve-3d;
      perspective: 1200px;
      transition: transform 0.65s var(--ease-out-quart);
    }

    .envelope-button:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 12px;
      border-radius: 6px;
    }

    /* Hover & Active Feedback (Only when closed/idle) */
    @media (hover: hover) and (pointer: fine) {
      .envelope-button:not(.is-opening):hover {
        transform: translate3d(0, -7px, 14px) scale(1.028) rotate(0.35deg);
      }

      .envelope-button:not(.is-opening):hover .envelope-ambient-shadow {
        transform: translateX(-50%) scaleX(1.07) scaleY(1.12);
        opacity: 0.72;
      }

      .envelope-button:not(.is-opening):hover .flap-top-3d {
        transform: rotateX(18deg);
      }

      .envelope-button:not(.is-opening):hover .wax-seal {
        transform: translate(-50%, -50%) scale(1.07) translateY(-2px);
        filter: drop-shadow(0 8px 14px rgba(88, 1, 11, 0.38));
      }
    }

    /* Touch / Active Press Feedback */
    .envelope-button:not(.is-opening):active {
      transform: translate3d(0, -2px, 4px) scale(0.988);
    }

    /* Ambient Shadow Beneath Envelope */
    .envelope-ambient-shadow {
      position: absolute;
      bottom: -24px;
      left: 50%;
      width: 88%;
      height: 28px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(88, 1, 11, 0.24) 0%, rgba(112, 2, 15, 0.09) 48%, transparent 76%);
      filter: blur(8px);
      z-index: 0;
      pointer-events: none;
      transition: transform 0.65s var(--ease-out-quart), opacity 0.65s var(--ease-out-quart);
      animation: shadowBreathe 6.2s var(--ease-in-out-sine) infinite;
    }

    .envelope-float-wrap.float-paused .envelope-ambient-shadow {
      animation-play-state: paused;
    }

    @keyframes shadowBreathe {
      0%, 100% {
        transform: translateX(-50%) scale(1);
        opacity: 0.85;
      }
      50% {
        transform: translateX(-50%) scale(0.92);
        opacity: 0.62;
      }
    }

    /* ==========================================================================
       5. PHYSICAL ENVELOPE LAYERS (BACK, LETTER, POCKET FOLDS, 3D FLAP, SEAL)
       ========================================================================== */
    .envelope-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      transform-style: preserve-3d;
      box-shadow:
        0 14px 34px -8px rgba(88, 1, 11, 0.16),
        0 4px 12px -2px rgba(88, 1, 11, 0.08),
        0 0 0 1px rgba(112, 2, 15, 0.34);
      background-color: var(--cream-paper);
    }

    /* 5.1 Back Base & Soft Blush Inner Lining (z-index: 1) */
    .envelope-back-lining {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      overflow: hidden;
      z-index: 1;
      background: linear-gradient(180deg, var(--soft-blush) 0%, #FCE8EA 62%, var(--ivory-shaded) 100%);
      box-shadow: inset 0 2px 12px rgba(88, 1, 11, 0.09);
    }

    .envelope-back-lining svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 5.2 Emerging Cream Letter Card Inside Envelope (z-index: 2 -> rises on open) */
    .letter-card {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 7%;
      height: 86%;
      background: linear-gradient(165deg, #FFFFFF 0%, var(--cream-paper) 58%, #F6F2EA 100%);
      border-radius: 3px;
      border: 1px solid rgba(112, 2, 15, 0.35);
      box-shadow:
        0 4px 14px rgba(88, 1, 11, 0.10),
        inset 0 0 24px rgba(254, 222, 225, 0.18);
      z-index: 2;
      padding: clamp(12px, 3.2vw, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transform-origin: center bottom;
      transform: translate3d(0, 0, 0) scale(0.98);
      transition:
        transform 1.15s var(--ease-letter-rise),
        box-shadow 1.15s var(--ease-letter-rise),
        opacity 0.6s ease;
      will-change: transform, opacity;
      overflow: hidden;
    }

    /* Subtle Inset Burgundy Frame on Emerging Letter */
    .letter-card-inner-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(112, 2, 15, 0.22);
      padding: clamp(10px, 2.5vw, 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        radial-gradient(circle at 50% 30%, rgba(254, 222, 225, 0.22), transparent 70%);
    }

    .letter-card-inner-frame::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 0.5px solid rgba(112, 2, 15, 0.11);
      pointer-events: none;
    }

    .letter-crest {
      width: clamp(22px, 5vw, 30px);
      height: auto;
      margin-bottom: clamp(6px, 1.5vw, 12px);
      opacity: 0.72;
      transition: opacity 0.45s ease;
    }

    .letter-preview-script {
      font-family: var(--font-script);
      color: var(--burgundy);
      font-size: clamp(1.35rem, 4.2vw, 1.85rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-align: center;
      opacity: 0.85;
      margin-bottom: 6px;
      transition: opacity 0.4s ease, filter 0.4s ease;
    }

    .letter-preview-lines {
      width: 72%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      opacity: 0.35;
      transition: opacity 0.4s ease;
    }

    .letter-preview-lines span {
      display: block;
      height: 1px;
      background: var(--burgundy);
      border-radius: 1px;
    }
    .letter-preview-lines span:nth-child(1) { width: 88%; }
    .letter-preview-lines span:nth-child(2) { width: 74%; }
    .letter-preview-lines span:nth-child(3) { width: 52%; }

    /* Letter Extraction States */
    .letter-card.is-emerging {
      transform: translate3d(0, -64%, 4px) scale(1.04) rotate(-0.8deg);
      box-shadow:
        0 18px 38px -6px rgba(88, 1, 11, 0.20),
        0 4px 12px rgba(88, 1, 11, 0.08);
    }

    .letter-card.is-zooming {
      transform: translate3d(0, -42%, 120px) scale(3.1) rotate(0deg);
      box-shadow: 0 28px 65px rgba(88, 1, 11, 0.14);
      opacity: 0;
      transition:
        transform 1.05s cubic-bezier(0.32, 0.04, 0.18, 1),
        opacity 0.85s cubic-bezier(0.32, 0.04, 0.18, 1) 0.18s;
    }

    .letter-card.is-zooming .letter-crest,
    .letter-card.is-zooming .letter-preview-script,
    .letter-card.is-zooming .letter-preview-lines {
      opacity: 0;
      filter: blur(4px);
    }

    /* 5.3 Front Pocket Folds (Left, Right, Bottom Flaps + "For Aju" Inscription) (z-index: 3) */
    .envelope-pocket-front {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: 5px;
      overflow: hidden;
    }

    .envelope-pocket-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Handwritten Calligraphic "For Aju" on Front of Envelope */
    .envelope-inscription-wrap {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: clamp(18px, 5.2vw, 30px);
      pointer-events: none;
    }

    .envelope-inscription {
      font-family: var(--font-calligraphy);
      font-size: clamp(2.15rem, 6.4vw, 3.05rem);
      font-weight: 400;
      color: var(--burgundy);
      letter-spacing: 0.03em;
      line-height: 1.08;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.75),
        0 2px 8px rgba(88, 1, 11, 0.08);
      transform: rotate(-1.5deg);
      transition: transform 0.5s var(--ease-out-quart), opacity 0.5s ease;
    }

    .envelope-inscription-flourish {
      width: clamp(56px, 15vw, 84px);
      height: auto;
      margin-top: 2px;
      opacity: 0.65;
    }

    /* 5.4 Upper 3D Opening Flap (z-index: 5 when closed -> drops to 1 when opened past 90deg) */
    .flap-top-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      transform-origin: top center;
      transform-style: preserve-3d;
      transform: rotateX(0deg);
      z-index: 5;
      transition: transform 0.92s var(--ease-flap);
      will-change: transform;
      pointer-events: none;
    }

    .flap-top-3d.is-open {
      transform: rotateX(180deg);
    }

    .flap-top-3d.z-behind-letter {
      z-index: 1;
    }

    /* Front Face of Upper Flap (Exterior Warm Ivory) */
    .flap-face-front,
    .flap-face-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flap-face-front {
      z-index: 2;
      filter: drop-shadow(0 5px 8px rgba(88, 1, 11, 0.11));
    }

    /* Back Face of Upper Flap (Interior Soft Blush Lining) */
    .flap-face-back {
      transform: rotateX(180deg);
      z-index: 1;
      filter: drop-shadow(0 -3px 8px rgba(88, 1, 11, 0.08));
    }

    .flap-face-front svg,
    .flap-face-back svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 5.5 Burgundy Wax Seal with Delicate Heart Detail (z-index: 6) */
    .wax-seal {
      position: absolute;
      top: 56.5%;
      left: 50%;
      width: clamp(48px, 12.5vw, 62px);
      height: clamp(48px, 12.5vw, 62px);
      transform: translate(-50%, -50%) scale(1);
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 5px 10px rgba(88, 1, 11, 0.32));
      transition:
        transform 0.52s var(--ease-out-quart),
        opacity 0.42s ease,
        filter 0.52s var(--ease-out-quart);
      will-change: transform, opacity;
    }

    .wax-seal svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wax-seal.is-dissolving {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.18);
      filter: blur(4px) drop-shadow(0 2px 4px rgba(88, 1, 11, 0.1));
    }

    /* ==========================================================================
       6. ENVELOPE CAPTION ("A little something for you.")
       ========================================================================== */
    .envelope-caption {
      margin-top: clamp(32px, 6.5vh, 48px);
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.02rem, 2.5vw, 1.22rem);
      color: var(--muted-burgundy);
      letter-spacing: 0.045em;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 1.1s var(--ease-out-quart),
        transform 1.1s var(--ease-out-quart);
    }

    .envelope-caption.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .envelope-caption.is-fading-out {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    /* ==========================================================================
       7. EMERGED FULL-SCREEN LETTER & SEQUENTIAL MESSAGE STAGE
       ========================================================================== */
    .reading-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(28px, env(safe-area-inset-top))
        clamp(22px, 6vw, 64px)
        max(28px, env(safe-area-inset-bottom))
        clamp(22px, 6vw, 64px);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s var(--ease-out-quart), visibility 0.8s;
    }

    .reading-stage.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Subtle Expanded Cream Stationery Backdrop During Reading */
    .letter-fullscreen-sheet {
      position: absolute;
      inset: clamp(18px, 3.8vmin, 38px);
      background:
        radial-gradient(circle at 50% 45%, rgba(251, 249, 245, 0.92) 0%, rgba(248, 245, 240, 0.72) 68%, rgba(254, 222, 225, 0.16) 100%);
      border: 1px solid rgba(112, 2, 15, 0.18);
      border-radius: 4px;
      box-shadow:
        inset 0 0 0 4px var(--warm-ivory),
        inset 0 0 0 5px rgba(112, 2, 15, 0.08),
        0 12px 48px rgba(88, 1, 11, 0.04);
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity 0.95s var(--ease-out-quart),
        transform 1.05s var(--ease-out-quart);
      pointer-events: none;
    }

    .reading-stage.is-active .letter-fullscreen-sheet {
      opacity: 1;
      transform: scale(1);
    }

    /* Center Container for Compliments & Breeze SVG */
    .message-vessel {
      position: relative;
      width: 100%;
      max-width: 880px;
      min-height: 220px;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5;
    }

    /* ==========================================================================
       8. COMPLIMENT TYPOGRAPHY & WIND-SWEEP ANIMATIONS
       ========================================================================== */
    .compliment-text {
      font-family: var(--font-script);
      font-weight: 400;
      font-size: clamp(2.45rem, 6.8vw, 4.75rem);
      line-height: 1.24;
      color: var(--burgundy);
      letter-spacing: 0.015em;
      max-width: 18ch;
      padding: 0.15em 0.25em;
      text-shadow: 0 2px 14px rgba(112, 2, 15, 0.06);
      opacity: 0;
      will-change: transform, opacity, filter;
      transform-origin: center center;
    }

    /* Slightly tailored sizing & playful proportion for Message 8 (the longer joke) */
    .compliment-text.is-playful-joke {
      font-size: clamp(2.05rem, 5.2vw, 3.65rem);
      max-width: 24ch;
      line-height: 1.32;
    }

    /* Message Entry Animation: Subtle Blur -> Crisp + Gentle Rise & Scale Settle */
    .compliment-text.enter-active {
      animation: messageWindEnter 0.68s var(--ease-out-quart) forwards;
    }

    .compliment-text.is-playful-joke.enter-active {
      animation: messagePlayfulEnter 0.76s var(--ease-out-quart) forwards;
    }

    @keyframes messageWindEnter {
      0% {
        opacity: 0;
        filter: blur(7px);
        transform: translate3d(-22px, 14px, 0) scale(0.94) rotate(-1.2deg);
      }
      65% {
        opacity: 1;
        filter: blur(0.4px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
    }

    @keyframes messagePlayfulEnter {
      0% {
        opacity: 0;
        filter: blur(7px);
        transform: translate3d(-18px, 16px, 0) scale(0.93) rotate(-2.2deg);

      60% {
        opacity: 1;
        filter: blur(0px);

      opacity: 1;
      filter: blur(0px);

      0% {
        transform: translate3d(0, 0px, 0) scale(1) rotate(0deg);
      }
      100% {
        transform: translate3d(3px, -3px, 0) scale(1.008) rotate(0.35deg);
      }
    }

    .compliment-text.wind-sweep-exit {
      animation: windSweepAway 0.66s var(--ease-wind-out) forwards;
    }

    .compliment-text.is-playful-joke.wind-sweep-exit {
      animation: windSweepAwayPlayful 0.70s var(--ease-wind-out) forwards;
    }

      0% {
        opacity: 1;
        filter: blur(0px);
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg) skewX(0deg);

        opacity: 0.88;
        filter: blur(1.5px);
        transform: translate3d(24px, -5px, 0) scale(0.99) rotate(1.1deg) skewX(-4deg);
      }
      100% {
        opacity: 0;
        filter: blur(9px);
        transform: translate3d(128px, -26px, 0) scale(0.95) rotate(3.8deg) skewX(-12deg);
      }

      0% {
        opacity: 1;
        filter: blur(0px);
        transform: translate3d(0, 0, 0) scale(1) rotate(-0.4deg) skewX(0deg);
      }
      30% {
        opacity: 0.86;
        filter: blur(1.5px);
        transform: translate3d(28px, -8px, 0) scale(0.99) rotate(1.8deg) skewX(-5deg);
      }
      100% {
        opacity: 0;
        filter: blur(9px);
        transform: translate3d(136px, -32px, 0) scale(0.94) rotate(4.6deg) skewX(-13deg);

    .breeze-svg-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(92vw, 760px);
      height: 220px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      overflow: visible;
    }

    .breeze-path {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      opacity: 0;
    }

    .breeze-path.primary {
      stroke: rgba(112, 2, 15, 0.30);
      stroke-width: 1.35;
    }

    .breeze-path.secondary {
      stroke: var(--soft-blush);
      stroke-width: 2.2;
    }

    .breeze-path.tertiary {
      stroke: rgba(112, 2, 15, 0.18);
      stroke-width: 1;
    }

    .breeze-svg-overlay.is-sweeping .breeze-path.primary {
      animation: breezeStrokeSweep 0.68s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .breeze-svg-overlay.is-sweeping .breeze-path.secondary {
      animation: breezeStrokeSweep 0.72s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.04s forwards;
    }

    .breeze-svg-overlay.is-sweeping .breeze-path.tertiary {
      animation: breezeStrokeSweep 0.64s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.08s forwards;
    }

    @keyframes breezeStrokeSweep {
      0% {
        stroke-dashoffset: 420;
        opacity: 0;
      }
      25% {
        opacity: 0.85;
      }
      75% {
        opacity: 0.65;
      }
      100% {
        stroke-dashoffset: -420;
        opacity: 0;
      }

    /* ==========================================================================
       9. FINAL REVEAL ("I love you.") & REPLAY INTERACTION ("Once more")
       ========================================================================== */
    .final-reveal-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 8;
    }

    .final-reveal-wrap.is-shown {
      display: flex;
    }

    .final-heart-motif {
      width: clamp(20px, 4vw, 28px);
      height: auto;
      margin-bottom: clamp(10px, 2vh, 18px);
      opacity: 0;
      transform: translateY(8px) scale(0.85);
    }

    .final-reveal-wrap.is-shown .final-heart-motif {
      animation: finalHeartAppear 1.3s var(--ease-out-quart) 0.15s forwards;
    }

    @keyframes finalHeartAppear {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.85);
      }
      100% {
        opacity: 0.82;
        transform: translateY(0) scale(1);
      }
    }

    .final-love-message {
      font-family: var(--font-script);
      font-weight: 400;
      font-size: clamp(3.6rem, 10.5vw, 6.8rem);
      line-height: 1.15;
      color: var(--burgundy);
      letter-spacing: 0.02em;
      padding: 0.1em 0.25em;
      text-shadow:
        0 2px 20px rgba(112, 2, 15, 0.09),
        0 1px 0 rgba(255, 255, 255, 0.6);
      opacity: 0;
      transform: translate3d(0, 16px, 0) scale(0.92);
      filter: blur(8px);
      will-change: transform, opacity, filter;
    }

    .final-reveal-wrap.is-shown .final-love-message {
      animation:
        finalMessageReveal 1.45s var(--ease-out-expo) forwards,
        finalMessageFloat 5.4s var(--ease-in-out-sine) 1.45s infinite alternate;
    }

    @keyframes finalMessageReveal {
      0% {
        opacity: 0;
        filter: blur(8px);
        transform: translate3d(0, 16px, 0) scale(0.92);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes finalMessageFloat {
      0% {
        transform: translate3d(0, 0px, 0) scale(1) rotate(0deg);
      }
      100% {
        transform: translate3d(0, -6px, 0) scale(1.015) rotate(-0.3deg);
      }
    }

    /* Replay Link ("Once more") Near Bottom of Screen */
    .replay-container {
      position: fixed;
      bottom: max(clamp(28px, 5.5vh, 52px), env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.9s var(--ease-out-quart),
        visibility 0.9s;
    }

    .replay-container.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .replay-link {
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-script);
      font-size: clamp(1.55rem, 3.8vw, 2rem);
      color: var(--muted-burgundy);
      letter-spacing: 0.03em;
      padding: 8px 18px;
      position: relative;
      outline: none;
      transition:
        color 0.4s ease,
        transform 0.4s var(--ease-out-quart);
    }

    /* Delicate Underline Flourish on Replay Link */
    .replay-link::after {
      content: '';
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: 6px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(112, 2, 15, 0.42), transparent);
      transform: scaleX(0.75);
      opacity: 0.65;
      transition:
        transform 0.45s var(--ease-out-quart),
        opacity 0.45s ease;
    }

    .replay-link:hover,
    .replay-link:focus-visible {
      color: var(--burgundy);
      transform: translateY(-2px);
    }

    .replay-link:hover::after,
    .replay-link:focus-visible::after {
      transform: scaleX(1);
      opacity: 1;
    }

    .replay-link:focus-visible {
      outline: 1px dashed var(--burgundy);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .replay-link:active {
      transform: translateY(0px) scale(0.97);
    }

    /* ==========================================================================
       10. RESPONSIVE MEDIA QUERIES & REDUCED MOTION
       ========================================================================== */
    @media (max-width: 480px) {
      :root {
        --env-width: clamp(265px, 84vw, 340px);
      }

      .editorial-border {
        inset: 10px;
      }

      .letter-fullscreen-sheet {
        inset: 14px;
      }

      .compliment-text {
        max-width: 15ch;
      }

      .compliment-text.is-playful-joke {
        max-width: 19ch;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      :root {
        --env-width: clamp(220px, 44vh, 300px);
      }

      .envelope-caption {
        margin-top: 18px;
      }

      .replay-container {
        bottom: 16px;
      }
    }

    /* Accessibility: Respect Prefers-Reduced-Motion while keeping sequence intact */
    @media (prefers-reduced-motion: reduce) {
      .envelope-float-wrap,
      .envelope-ambient-shadow,
      .compliment-text.hold-steady,
      .final-reveal-wrap.is-shown .final-love-message {
        animation: none !important;
      }

      .envelope-entrance-wrap {
        transition: opacity 0.6s ease !important;
        transform: none !important;
      }

      .compliment-text.enter-active,
      .compliment-text.is-playful-joke.enter-active {
        animation: reducedFadeIn 0.45s ease forwards !important;
      }

      .compliment-text.wind-sweep-exit,
      .compliment-text.is-playful-joke.wind-sweep-exit {
        animation: reducedFadeOut 0.45s ease forwards !important;
      }

      @keyframes reducedFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes reducedFadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
    }
  </style>

      <div class="message-vessel">
        <!-- Individual Sequential Compliment Element -->
        <p id="complimentText" class="compliment-text"></p>

        <!-- Delicate Animated Breeze Strokes for Wind-Sweep Transitions -->
        <svg
          id="breezeOverlay"
          class="breeze-svg-overlay"
          viewBox="0 0 700 200"
          fill="none"
          aria-hidden="true"
        >
          <path
            class="breeze-path primary"
            d="M 30,118 C 165,112 260,68 410,82 C 520,92 595,64 675,44"
          />
          <path
            class="breeze-path secondary"
            d="M 65,142 C 210,148 325,104 465,108 C 555,110 620,86 685,72"
          />
          <path
            class="breeze-path tertiary"
            d="M 95,78 C 215,64 335,42 475,54 C 560,62 615,38 665,26"
          />
        </svg>

        <!-- Final Reveal Container: "I love you." -->
        <div id="finalRevealWrap" class="final-reveal-wrap">
          <svg class="final-heart-motif" viewBox="0 0 36 32" fill="none" aria-hidden="true">
            <path
              d="M18 27.5 C18 27.5 5 18.2 5 10.2 C5 5.8 8.5 2.5 12.8 2.5 C15.4 2.5 17.3 4.0 18 5.9 C18.7 4.0 20.6 2.5 23.2 2.5 C27.5 2.5 31 5.8 31 10.2 C31 18.2 18 27.5 18 27.5 Z"
              fill="rgba(254, 222, 225, 0.7)"
              stroke="#70020F"
              stroke-width="1.2"
            />
          </svg>
          <h1 id="finalLoveMessage" class="final-love-message">I love you.</h1>
        </div>
      </div>
    </section>

    <!-- 3. SUBTLE HANDWRITTEN REPLAY LINK ("Once more") -->
    <div id="replayContainer" class="replay-container">
      <button id="replayBtn" type="button" class="replay-link">Once more</button>
    </div>

  </main>

  <!-- ==========================================================================
       JAVASCRIPT CHOREOGRAPHY, TIMING & AUDIO CONTROLLER
       ========================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ------------------------------------------------------------------------
         1. EXACT MESSAGE SEQUENCE
         ------------------------------------------------------------------------ */
      const COMPLIMENT_MESSAGES = [
        { text: "You are very pretty.", isPlayful: false, holdDuration: 1220 },
        { text: "You are the sweetest girl.", isPlayful: false, holdDuration: 1220 },
        { text: "Your smile is so unique.", isPlayful: false, holdDuration: 1220 },
        { text: "You are genuinely gorgeous.", isPlayful: false, holdDuration: 1240 },
        { text: "You are such a pretty girl.", isPlayful: false, holdDuration: 1220 },
        { text: "You've got a really great personality.", isPlayful: false, holdDuration: 1300 },
        { text: "You are very cute.", isPlayful: false, holdDuration: 1200 },
        {
          text: "And I know you're a little obsessed with me. Don't worry, your secret's safe.",
          isPlayful: true,
          holdDuration: 2150
        }
      ];

      const FINAL_MESSAGE_TEXT = "I love you.";

      /* ------------------------------------------------------------------------
         2. DOM ELEMENTS
         ------------------------------------------------------------------------ */
      const bgMusic = document.getElementById('bgMusic');
      const envelopeSection = document.getElementById('envelopeSection');
      const envelopeEntrance = document.getElementById('envelopeEntrance');
      const envelopeFloat = document.getElementById('envelopeFloat');
      const envelopeBtn = document.getElementById('envelopeBtn');
      const envelopeCaption = document.getElementById('envelopeCaption');
      const topFlap = document.getElementById('topFlap');
      const waxSeal = document.getElementById('waxSeal');
      const letterCard = document.getElementById('letterCard');

      const readingStage = document.getElementById('readingStage');
      const complimentText = document.getElementById('complimentText');
      const breezeOverlay = document.getElementById('breezeOverlay');
      const finalRevealWrap = document.getElementById('finalRevealWrap');
      const finalLoveMessage = document.getElementById('finalLoveMessage');
      const replayContainer = document.getElementById('replayContainer');
      const replayBtn = document.getElementById('replayBtn');

      /* ------------------------------------------------------------------------
         3. STATE & TIMER REGISTRY
         ------------------------------------------------------------------------ */
      let activeTimers = [];
      let experienceState = 'INITIAL'; // 'INITIAL' | 'IDLE_ENVELOPE' | 'OPENING' | 'MESSAGES' | 'FINAL' | 'RESETTING'
      let musicStarted = false;

      function scheduleTimer(callback, delay) {
        const id = window.setTimeout(() => {
          activeTimers = activeTimers.filter((t) => t !== id);
          callback();
        }, delay);
        activeTimers.push(id);
        return id;
      }

      function clearAllTimers() {
        while (activeTimers.length > 0) {
          const id = activeTimers.pop();
          window.clearTimeout(id);
        }
      }

      /* ------------------------------------------------------------------------
         4. BACKGROUND MUSIC — AUTOPLAY + FIRST-GESTURE FALLBACK
         ------------------------------------------------------------------------ */
      function initBackgroundMusic() {
        if (!bgMusic) return;

        // Comfortable, warm background volume
        bgMusic.volume = 0.42;

        attemptMusicPlay();
      }

      function attemptMusicPlay() {
        if (!bgMusic || musicStarted) return;

        // Only attempt if paused so we never restart an already playing track
        if (!bgMusic.paused) {
          musicStarted = true;
          return;
        }

        try {
          const playPromise = bgMusic.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                musicStarted = true;
              })
              .catch(() => {
                // Autoplay blocked by browser policy or placeholder file not yet added;
                // Will seamlessly retry on the first envelope interaction.
              });
          }
        } catch (err) {
          // Ignore playback exception gracefully
        }
      }

      /* ------------------------------------------------------------------------
         5. INITIAL ENVELOPE ENTRANCE CHOREOGRAPHY
         ------------------------------------------------------------------------ */
      function runInitialEnvelopeEntrance() {
        clearAllTimers();
        experienceState = 'INITIAL';

        // Ensure final message text is exact
        finalLoveMessage.textContent = FINAL_MESSAGE_TEXT;

        // Short calm moment before envelope gently arrives
        scheduleTimer(() => {
          envelopeEntrance.classList.add('has-entered');
        }, 220);

        scheduleTimer(() => {
          envelopeCaption.classList.add('is-visible');
          experienceState = 'IDLE_ENVELOPE';
        }, 860);
      }

      /* ------------------------------------------------------------------------
         6. ENVELOPE OPENING SEQUENCE (3D FLAP, SEAL, LETTER EMERGENCE)
         ------------------------------------------------------------------------ */
      function handleEnvelopeOpen() {
        // Trigger music fallback on this user gesture if autoplay was blocked
        attemptMusicPlay();

        // Guard against double clicks or clicking during another transition
        if (experienceState !== 'IDLE_ENVELOPE' && experienceState !== 'INITIAL') {
          return;
        }

        experienceState = 'OPENING';
        clearAllTimers();

        // Lock button hover transformations & stop idle floating smoothly
        envelopeBtn.classList.add('is-opening');
        envelopeBtn.setAttribute('aria-expanded', 'true');
        envelopeFloat.classList.add('float-paused');
        envelopeCaption.classList.remove('is-visible');
        envelopeCaption.classList.add('is-fading-out');

        // Step 1: Dissolve the burgundy wax seal
        scheduleTimer(() => {
          waxSeal.classList.add('is-dissolving');
        }, 80);

        // Step 2: Unfold the top envelope flap in 3D (rotateX 180deg)
        scheduleTimer(() => {
          topFlap.classList.add('is-open');
        }, 280);

        // Step 3: At midpoint of 3D rotation (~90deg), drop flap z-index behind the letter
        // so the rising letter emerges naturally in front of the open blush flap
        scheduleTimer(() => {
          topFlap.classList.add('z-behind-letter');
        }, 720);

        // Step 4: Slide the cream letter upward out of the envelope pocket
        scheduleTimer(() => {
          letterCard.classList.add('is-emerging');
        }, 860);

        // Step 5: Zoom the letter toward the viewer while the envelope recedes into the background
        scheduleTimer(() => {
          letterCard.classList.add('is-zooming');
          envelopeEntrance.classList.add('is-receding');
          readingStage.classList.add('is-active');
        }, 1820);

        // Step 6: Hide envelope layer completely and start the sequential compliments
        scheduleTimer(() => {
          envelopeSection.classList.add('is-hidden');
          startComplimentSequence();
        }, 2620);
      }

      /* ------------------------------------------------------------------------
         7. SEQUENTIAL COMPLIMENT & WIND-SWEEP ENGINE
         ------------------------------------------------------------------------ */
      function startComplimentSequence() {
        experienceState = 'MESSAGES';
        complimentText.style.display = 'block';
        finalRevealWrap.classList.remove('is-shown');
        showComplimentAtIndex(0);
      }

      function showComplimentAtIndex(index) {
        if (index >= COMPLIMENT_MESSAGES.length) {
          revealFinalLoveMessage();
          return;
        }

        const item = COMPLIMENT_MESSAGES[index];

        // Reset classes on text and breeze overlay
        complimentText.className = 'compliment-text';
        if (item.isPlayful) {
          complimentText.classList.add('is-playful-joke');
        }
        breezeOverlay.classList.remove('is-sweeping');

        // Set exact message wording
        complimentText.textContent = item.text;

        // Force reflow so entry animation triggers cleanly every time
        void complimentText.offsetWidth;

        // 1. Trigger smooth entry animation
        complimentText.classList.add('enter-active');

        const entryDuration = item.isPlayful ? 760 : 680;

        // 2. Switch to subtle living hold once settled
        scheduleTimer(() => {
          complimentText.classList.remove('enter-active');
          complimentText.classList.add('hold-steady');
        }, entryDuration);

        // 3. After hold duration, sweep message away with gentle breeze strokes
        scheduleTimer(() => {
          complimentText.classList.remove('hold-steady');
          complimentText.classList.add('wind-sweep-exit');

          // Re-trigger SVG breeze stroke animation
          breezeOverlay.classList.remove('is-sweeping');
          void breezeOverlay.offsetWidth;
          breezeOverlay.classList.add('is-sweeping');
        }, entryDuration + item.holdDuration);

        const exitDuration = item.isPlayful ? 720 : 680;
        const interMessagePause = 170;

        // 4. Advance to next message once breeze sweep completes
        scheduleTimer(() => {
          breezeOverlay.classList.remove('is-sweeping');
          showComplimentAtIndex(index + 1);
        }, entryDuration + item.holdDuration + exitDuration + interMessagePause);
      }

      /* ------------------------------------------------------------------------
         8. FINAL REVEAL ("I love you.") & REPLAY APPEARANCE
         ------------------------------------------------------------------------ */
      function revealFinalLoveMessage() {
        experienceState = 'FINAL';

        // Clear and hide the sequential message node
        complimentText.textContent = '';
        complimentText.className = 'compliment-text';
        complimentText.style.display = 'none';

        // Brief calm pause after the last breeze settles before revealing "I love you."
        scheduleTimer(() => {
          finalLoveMessage.textContent = FINAL_MESSAGE_TEXT;
          finalRevealWrap.classList.add('is-shown');
        }, 380);

        // Gently introduce the "Once more" replay link after "I love you." has settled
        scheduleTimer(() => {
          replayContainer.classList.add('is-visible');
        }, 1950);
      }

      /* ------------------------------------------------------------------------
         9. REPLAY INTERACTION ("Once more") — CLEAN STATE RESET
         ------------------------------------------------------------------------ */
      function handleReplay() {
        // Prevent replay while another transition is still in progress
        if (experienceState !== 'FINAL') {
          return;
        }

        // Ensure background music continues smoothly (or starts if it hadn't yet)
        attemptMusicPlay();

        experienceState = 'RESETTING';
        clearAllTimers();

        // 1. Smoothly fade out the replay link and reading stage
        replayContainer.classList.remove('is-visible');
        readingStage.classList.remove('is-active');

        scheduleTimer(() => {
          // 2. Reset all final and message elements
          finalRevealWrap.classList.remove('is-shown');
          complimentText.textContent = '';
          complimentText.className = 'compliment-text';
          breezeOverlay.classList.remove('is-sweeping');

          // 3. Reset all physical envelope layers to their closed state
          envelopeBtn.classList.remove('is-opening');
          envelopeBtn.setAttribute('aria-expanded', 'false');
          envelopeFloat.classList.remove('float-paused');
          waxSeal.classList.remove('is-dissolving');
          topFlap.classList.remove('is-open', 'z-behind-letter');
          letterCard.classList.remove('is-emerging', 'is-zooming');

          // Prepare envelope entrance wrapper in its pre-entrance pose
          envelopeEntrance.classList.remove('has-entered', 'is-receding');
          envelopeCaption.classList.remove('is-visible', 'is-fading-out');
          envelopeSection.classList.remove('is-hidden');

          // Force reflow so transitions apply cleanly
          void envelopeEntrance.offsetWidth;

          // 4. Re-run the gentle envelope entrance
          runInitialEnvelopeEntrance();
        }, 820);
      }

      /* ------------------------------------------------------------------------
         10. EVENT LISTENERS & INITIALIZATION
         ------------------------------------------------------------------------ */
      envelopeBtn.addEventListener('click', handleEnvelopeOpen);
      replayBtn.addEventListener('click', handleReplay);

      // Additional passive listener for earliest possible audio unlock if browser blocked load autoplay
      document.addEventListener('pointerdown', attemptMusicPlay, { passive: true });
      document.addEventListener('keydown', attemptMusicPlay, { passive: true });

      // Start on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          initBackgroundMusic();
          runInitialEnvelopeEntrance();
        });
      } else {
        initBackgroundMusic();
        runInitialEnvelopeEntrance();
      }
    })();
  </script>
</body>
</html>
